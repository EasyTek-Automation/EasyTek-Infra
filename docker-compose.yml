services:

  webapp:
    # A diretiva 'build' foi removida.
    # A imagem agora aponta para o registro da sua organização.
    image: ghcr.io/easytek-automation/easytek-data/webapp:${TAG:-latest}
    env_file:
      - .env.common
    environment:
      # Caminho do volume de documentação dentro do container
      - DOCS_PROCEDURES_PATH=/app/docs/procedures
    volumes:
      # Volume externo para documentação (editável sem rebuild)
      # Host: ./docs/procedures -> Container: /app/docs/procedures
      - ./docs/procedures:/app/docs/procedures:ro
    networks:
      - easytek-net

  event-gateway:
    image: ghcr.io/easytek-automation/easytek-data/event-gateway:${TAG:-latest}
    env_file:
      - .env.common
    networks:
      - easytek-net

  zpp-processor:
    image: ghcr.io/easytek-automation/easytek-data/zpp-processor:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.common
    environment:
      - PORT=5002
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BATCH_SIZE=${ZPP_BATCH_SIZE:-1000}
      - BASE_DATA_DIR=/data
      - SCHEDULER_INTERVAL_SECONDS=${ZPP_SCHEDULER_INTERVAL_SECONDS:-3600}
      - MONTH_BOUNDARY_RULE=${ZPP_MONTH_BOUNDARY_RULE:-fim}
      - WEBAPP_INTERNAL_URL=${WEBAPP_INTERNAL_URL:-http://webapp:8050}
    volumes:
      # Volumes de rede CIFS (\\sumare\Comum\manutencao\AMG EASYTEK DATA)
      - zpp-input:/data/input:rw
      - zpp-output:/data/output:rw
      - zpp-logs:/data/logs:rw
    networks:
      - easytek-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  node-red:
    image: ghcr.io/easytek-automation/easytek-data/node-red:${TAG:-latest}
    restart: unless-stopped
    user: root # <--- VERIFIQUE SE ESTA LINHA EXISTE
    volumes:
      - node_red_modules:/data/node_modules
      #- ${NODE_RED_DATA_PATH}:/data
    networks:
      - easytek-net

  amg-mobile:
    image: ghcr.io/easytek-automation/easytek-data/amg-mobile:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.common
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # URL da API Flask para proxy interno
      - NEXT_PUBLIC_API_URL=http://webapp:8050
    networks:
      - easytek-net
    depends_on:
      - webapp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # Volumes de rede para ZPP Processor (CIFS/SMB)
  zpp-input:
    driver: local
    driver_opts:
      type: cifs
      device: //sumare/Comum/manutencao/AMG EASYTEK DATA/input
      o: username=${ZPP_NETWORK_USER},password=${ZPP_NETWORK_PASSWORD},uid=1000,gid=1000,file_mode=0777,dir_mode=0777

  zpp-output:
    driver: local
    driver_opts:
      type: cifs
      device: //sumare/Comum/manutencao/AMG EASYTEK DATA/output
      o: username=${ZPP_NETWORK_USER},password=${ZPP_NETWORK_PASSWORD},uid=1000,gid=1000,file_mode=0777,dir_mode=0777

  zpp-logs:
    driver: local
    driver_opts:
      type: cifs
      device: //sumare/Comum/manutencao/AMG EASYTEK DATA/logs
      o: username=${ZPP_NETWORK_USER},password=${ZPP_NETWORK_PASSWORD},uid=1000,gid=1000,file_mode=0777,dir_mode=0777

  # Volumes existentes
  mongo-data:
  portainer_data:
  node_red_modules:


networks:
  easytek-net:
    external: true
