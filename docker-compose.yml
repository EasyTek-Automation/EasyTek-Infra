name: amg-infra
services:

  webapp:
    # A diretiva 'build' foi removida.
    # A imagem agora aponta para o registro da sua organização.
    image: ghcr.io/easytek-automation/easytek-data/webapp:${TAG:-latest}
    ports:
      - "8050:8050"
    env_file:
      - .env.common
    environment:
      # Caminho do volume de documentação dentro do container
      - DOCS_PROCEDURES_PATH=/app/docs/procedures
    volumes:
      # Volume externo para documentação (editável sem rebuild)
      # Host: ./docs/procedures -> Container: /app/docs/procedures
      - ./docs/procedures:/app/docs/procedures:ro
    networks:
      - easytek-net

  vent-gateway:
    image: ghcr.io/easytek-automation/easytek-data/event-gateway:${TAG:-latest}
    ports:
      - "5001:5001"
    env_file:
      - .env.common
    networks:
      - easytek-net

  node-red:
    container_name: node-red
    image: ghcr.io/easytek-automation/easytek-data/node-red:${TAG:-latest}
    restart: unless-stopped
    user: root # <--- VERIFIQUE SE ESTA LINHA EXISTE
    volumes:
      - node_red_modules:/data/node_modules
      #- ${NODE_RED_DATA_PATH}:/data
    networks:
      - easytek-net

volumes:
  mongo-data:
  portainer_data:
  node_red_modules:


networks:
  easytek-net:
    external: true
