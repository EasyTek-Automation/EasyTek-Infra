

services:
  webapp:
    ports:
      - "8050:8050"
    environment:
      MONGO_URI: mongodb://database:27017

  event-gateway:
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb://database:27017

  zpp-processor:
    ports:
      - "5002:5002"
    environment:
      MONGO_URI: mongodb://database:27017
    volumes:
      - zpp-rejected:/data/rejected:rw

  amg-mobile:
    ports:
      - "3001:3000"

  database:
    image: mongo:8.2
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - easytek-net

  portainer:
    image: portainer/portainer-ce:2.21.4
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PORTAINER_DATA_PATH}:/data
    networks:
      - easytek-net

volumes:
  mongo-data:
    name: mongo-data
    driver: local
  zpp-rejected:
    driver: local
    driver_opts:
      type: cifs
      device: //sumare/Comum/manutencao/AMG EASYTEK DATA/rejected
      o: username=${ZPP_NETWORK_USER},password=${ZPP_NETWORK_PASSWORD},uid=1000,gid=1000,file_mode=0777,dir_mode=0777
