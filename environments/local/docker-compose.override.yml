services:
  webapp:
    build:
      context: ../AMG_Data/webapp
    ports:
      - "8050:8050"
    environment:
      MONGO_URI: mongodb://database:27017
    volumes:
      - ./logs:/app/logs
      - ../AMG_Data/webapp/src:/app/src:ro   # KPIReport dev — hot reload do código Python; afeta apenas ambiente local (env=local)
      - ../AMG_Data/webapp/tests:/app/tests:ro   # KPIReport dev — hot reload da suite de testes (IM-06)

  event-gateway:
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb://database:27017

  zpp-processor:
    build:
      context: ../AMG_Data/zpp-processor
    ports:
      - "5002:5002"
    environment:
      MONGO_URI: mongodb://database:27017
    volumes:
      # Substituir volumes CIFS por diretórios locais para desenvolvimento
      - ./zpp-data/input:/data/input:rw
      - ./zpp-data/output:/data/output:rw
      - ./zpp-data/logs:/data/logs:rw
      - ./zpp-data/rejected:/data/rejected:rw

  node-red:
    ports:
      - "1880:1880"
    user: root
    volumes:
      - type: volume
        source: node_red_modules
        target: /data/node_modules
        volume: {}

  database:
    image: mongo:8.2
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - easytek-net

  mongo-init:
    image: mongo:8.2
    depends_on:
      - database
    restart: "no"
    networks:
      - easytek-net
    entrypoint:
      - bash
      - -c
      - |
        echo "[mongo-init] Aguardando MongoDB responder..."
        for i in $(seq 1 30); do
          if mongosh --host database:27017 --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q '^1$'; then
            echo "[mongo-init] MongoDB respondeu"; break
          fi
          sleep 2
        done
        mongosh --host database:27017 --quiet --eval '
          try {
            var cfg = rs.conf();
            var needFix = cfg.members.length !== 1 || cfg.members[0].host !== "database:27017";
            if (needFix) {
              print("[mongo-init] Reconfigurando host para database:27017...");
              cfg.members = [{_id: 0, host: "database:27017"}];
              cfg.version = cfg.version + 1;
              db.adminCommand({replSetReconfig: cfg, force: true});
              print("[mongo-init] Reconfig concluído");
            } else {
              print("[mongo-init] Replica set OK (host correto)");
            }
          } catch (e) {
            if (e.codeName === "NotYetInitialized") {
              print("[mongo-init] Inicializando rs0...");
              rs.initiate({_id: "rs0", members: [{_id: 0, host: "database:27017"}]});
              print("[mongo-init] Inicialização concluída");
            } else {
              print("[mongo-init] Erro inesperado: " + e.message);
              quit(1);
            }
          }'

  amg-mobile:
    ports:
      - "3001:3000"

  portainer:
    ports:
      - "9443:9443"
    image: portainer/portainer-ce:2.21.4
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PORTAINER_DATA_PATH}:/data
    networks:
      - easytek-net

volumes:
  mongo-data:
    name: mongo-data
    driver: local

  # Sobrescrever volumes CIFS com volumes locais para desenvolvimento
  zpp-input:
    driver: local
  zpp-output:
    driver: local
  zpp-logs:
    driver: local
