# easytek-infra/environments/local/docker-compose.override.yml
services:
  webapp:
    build:
      context: ${CODE_PATH}/webapp
    volumes:
      - ${CODE_PATH}/webapp:/app

  event-gateway:
    build:
      context: ${CODE_PATH}/event-gateway
    volumes:
      - ${CODE_PATH}/event-gateway:/app

  node-red:
    build:
      context: ${CODE_PATH}/node-red
    # MUDANÇA AQUI: O volume agora aponta para a pasta do código-fonte.
    volumes:
      - ${CODE_PATH}/node-red:/data

  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - easytek-net

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PORTAINER_DATA_PATH}:/data
    networks:
      - easytek-net
